<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail.td API Web Client</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-4">Mail.td Web Client</h1>
        
        <!-- টোকেন ও কনফিগারেশন -->
        <div class="mb-6 bg-slate-100 p-4 rounded-lg">
            <label class="block text-sm font-medium text-slate-700 mb-1">API Token</label>
            <input type="password" id="apiToken" value="td_e6be5a31ce02ee97ce02d18f6c6a83e82f2a1fe602aed27b24791baec2cca522" class="w-full p-2 border border-slate-300 rounded bg-white text-sm font-mono" placeholder="td_...">
        </div>

        <!-- একাউন্ট তৈরি সেকশন -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
            <input type="text" id="username" placeholder="Username (e.g. testuser)" class="p-2 border border-slate-300 rounded text-sm">
            <select id="domainSelect" class="p-2 border border-slate-300 rounded text-sm bg-white">
                <option value="">Loading domains...</option>
            </select>
            <button onclick="createInbox()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2 rounded text-sm transition">Create Inbox</button>
        </div>

        <!-- স্ট্যাটাস ও ইনবক্স ইনফো -->
        <div id="accountInfo" class="hidden mb-6 p-4 bg-indigo-50 border border-indigo-100 rounded-lg text-sm">
            <p><strong>Active Email:</strong> <span id="currentEmail" class="font-mono text-indigo-700"></span></p>
            <p><strong>Account ID:</strong> <span id="currentAccountId" class="font-mono text-slate-600"></span></p>
        </div>

        <!-- মেসেজ সেকশন -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-700">Inbox Messages</h2>
                <button onclick="fetchMessages()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded text-sm transition">Refresh</button>
            </div>
            <div id="messagesList" class="border border-slate-200 rounded-lg divide-y divide-slate-200 min-h-[150px] bg-slate-50">
                <div class="p-4 text-center text-slate-400 text-sm">No inbox created or messages loaded yet.</div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://api.mail.td';
        let currentAccountId = null;

        async function loadDomains() {
            try {
                const res = await fetch(`${BASE_URL}/api/domains`);
                const data = await res.json();
                const select = document.getElementById('domainSelect');
                select.innerHTML = '';
                if(data.domains) {
                    data.domains.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.domain;
                        opt.textContent = d.domain;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('Failed to load domains', err);
            }
        }

        async function createInbox() {
            const token = document.getElementById('apiToken').value.trim();
            const username = document.getElementById('username').value.trim();
            const domain = document.getElementById('domainSelect').value;

            if(!username || !domain) {
                alert('Please enter a username and select a domain.');
                return;
            }

            const address = `${username}@${domain}`;
            const password = 'SecurePassword123!';

            try {
                const res = await fetch(`${BASE_URL}/api/accounts`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ address, password })
                });

                const data = await res.json();
                if(res.ok) {
                    currentAccountId = data.id;
                    document.getElementById('currentEmail').textContent = data.address;
                    document.getElementById('currentAccountId').textContent = data.id;
                    document.getElementById('accountInfo').classList.remove('hidden');
                    fetchMessages();
                } else {
                    alert('Error: ' + (data.message || JSON.stringify(data)));
                }
            } catch (err) {
                alert('Request failed: ' + err.message);
            }
        }

        async function fetchMessages() {
            if(!currentAccountId) return;
            const token = document.getElementById('apiToken').value.trim();

            try {
                const res = await fetch(`${BASE_URL}/api/accounts/${currentAccountId}/messages?page=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const listDiv = document.getElementById('messagesList');
                
                if(data.messages && data.messages.length > 0) {
                    listDiv.innerHTML = '';
                    data.messages.forEach(msg => {
                        const item = document.createElement('div');
                        item.className = 'p-3 bg-white text-sm flex flex-col gap-1';
                        item.innerHTML = `
                            <div class="flex justify-between text-xs text-slate-500">
                                <span>From: ${msg.sender}</span>
                                <span>${new Date(msg.created_at).toLocaleTimeString()}</span>
                            </div>
                            <div class="font-medium text-slate-800">${msg.subject || '(No Subject)'}</div>
                            <div class="text-slate-600 bg-slate-50 p-2 rounded mt-1">${msg.text_body || 'No text body'}</div>
                        `;
                        listDiv.appendChild(item);
                    });
                } else {
                    listDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">Inbox is empty.</div>';
                }
            } catch (err) {
                console.error('Failed to fetch messages', err);
            }
        }

        // পেজ লোড হওয়ার সাথে ডোমেইনগুলো ফেচ করবে
        loadDomains();
    </script>
</body>
                                                </html>
