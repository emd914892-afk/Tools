<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --border-color: #334155;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --highlight-color: #38bdf8;
            --box-bg: #0f172a;
            --drawer-bg: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #cbd5e1;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --highlight-color: #0284c7;
            --box-bg: #f8fafc;
            --drawer-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 15px; 
            transition: background-color 0.3s, color 0.3s;
        }

        .top-navbar {
            max-width: 480px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 8px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { background: var(--border-color); }

        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.active { display: block; opacity: 1; }

        .side-drawer {
            position: fixed;
            top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--drawer-bg);
            z-index: 1002;
            transition: left 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .side-drawer.open { left: 0; }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title { font-weight: bold; font-size: 16px; color: var(--highlight-color); }

        .drawer-menu { list-style: none; padding: 15px 0; margin: 0; }

        .drawer-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .drawer-menu li a:hover, .drawer-menu li a.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            border: 1px solid var(--border-color);
            width: 100%;
        }

        h2 { text-align: center; color: var(--highlight-color); margin: 0 0 5px 0; font-size: 22px; font-weight: bold; }
        .subtitle { text-align: center; font-size: 11px; color: var(--subtext-color); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        /* Fix for Mail Input & Domain Screen Overflow */
        .email-input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            align-items: center;
            width: 100%;
        }

        .username-input {
            flex: 1 1 50%;
            min-width: 0;
            padding: 12px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--box-bg);
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .at-symbol {
            font-weight: bold;
            color: var(--subtext-color);
            font-size: 14px;
            flex-shrink: 0;
        }

        .domain-input {
            flex: 1 1 45%;
            min-width: 0;
            padding: 12px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--box-bg);
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            gap: 8px;
            transition: 0.2s;
        }

        .action-btn:hover { background: var(--accent-hover); }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 10px 0;
        }

        .inbox-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--highlight-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-inbox-btn {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .refresh-inbox-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
        }

        .message-list {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            min-height: 180px;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
        }

        .msg-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .msg-item:last-child { border-bottom: none; }
        .msg-from { font-size: 12px; color: var(--highlight-color); font-weight: bold; word-break: break-all; }
        .msg-subject { font-size: 13px; font-weight: bold; margin: 3px 0; color: var(--text-color); word-break: break-all; }

        .msg-body-view {
            margin-top: 15px;
            padding: 15px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none;
            word-break: break-word;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <button class="icon-btn" onclick="toggleDrawer()" title="Menu">☰</button>
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <span class="drawer-title">Navigation Menu</span>
            <button class="icon-btn" onclick="closeDrawer()">✕</button>
        </div>
        <ul class="drawer-menu">
            <li><a href="index.html">✉️ Mail Reader</a></li>
            <li><a href="fa.html">🔑 2 FA Authentication</a></li>
            <li><a href="tm.html" class="active">📧 Temp Mail</a></li>
            <li><a href="fng.html">👤 Fake Name Generate</a></li>
            <li><a href="fsg.html">🆔 Fake SSN Generate</a></li>
        </ul>
    </div>

    <div class="container">
        <h2>Temp Mail</h2>
        <div class="subtitle">Catchmail Free Email API</div>
        
        <div class="email-input-group">
            <input type="text" id="usernameInput" class="username-input" placeholder="Username" onchange="updateCustomMail()">
            <span class="at-symbol">@</span>
            <input type="text" id="domainInput" class="domain-input" value="catchmail.io" onchange="updateCustomMail()">
        </div>

        <div class="button-group">
            <button class="action-btn" onclick="copyEmail()">📋 Copy Email</button>
            <button class="action-btn" onclick="createNewEmail()">🔄 New Mail</button>
        </div>

        <div class="inbox-header">
            <div class="inbox-title">
                <span>📬 Inbox</span>
                <span id="status" style="font-size:11px; color:#22c55e; text-transform:none;">Live Checking...</span>
            </div>
            <button class="refresh-inbox-btn" onclick="manualCheckInbox()">🔄 Refresh</button>
        </div>

        <div class="message-list" id="inboxList">
            <div style="text-align: center; color: var(--subtext-color); padding-top: 60px;">No messages yet</div>
        </div>

        <div class="msg-body-view" id="msgContent">
            <div id="msgHeader" style="font-weight:bold; margin-bottom:10px; font-size: 12px; color: var(--highlight-color);"></div>
            <div id="msgBody" style="font-size:13px; white-space: pre-wrap; color: var(--text-color);"></div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        let currentEmail = "";
        let autoRefreshTimer = null;

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            document.getElementById("themeToggleBtn").innerText = newTheme === "light" ? "🌙" : "☀️";
        }

        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.add('open');
            document.getElementById('drawerOverlay').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('sideDrawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('active');
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        }

        function getRandomString(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function createNewEmail() {
            const username = getRandomString(9);
            const domain = document.getElementById("domainInput").value.trim() || "catchmail.io";
            
            document.getElementById("usernameInput").value = username;
            currentEmail = `${username}@${domain}`;
            
            localStorage.setItem("catchmail_user", username);
            localStorage.setItem("catchmail_domain", domain);

            resetInboxState();
        }

        function updateCustomMail() {
            const username = document.getElementById("usernameInput").value.trim();
            const domain = document.getElementById("domainInput").value.trim() || "catchmail.io";

            if (username) {
                currentEmail = `${username}@${domain}`;
                localStorage.setItem("catchmail_user", username);
                localStorage.setItem("catchmail_domain", domain);
                resetInboxState();
            }
        }

        function loadSavedEmail() {
            const savedUser = localStorage.getItem("catchmail_user");
            const savedDomain = localStorage.getItem("catchmail_domain");

            if (savedUser) {
                document.getElementById("usernameInput").value = savedUser;
                document.getElementById("domainInput").value = savedDomain || "catchmail.io";
                currentEmail = `${savedUser}@${savedDomain || "catchmail.io"}`;
                resetInboxState();
            } else {
                createNewEmail();
            }
        }

        function resetInboxState() {
            document.getElementById("msgContent").style.display = "none";
            document.getElementById("status").innerText = "Live Checking...";
            document.getElementById("inboxList").innerHTML = `<div style="text-align: center; color: var(--subtext-color); padding-top: 60px;">No messages yet</div>`;

            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            checkInbox();
            autoRefreshTimer = setInterval(checkInbox, 3000);
        }

        function manualCheckInbox() {
            document.getElementById("status").innerText = "Fetching...";
            checkInbox().then(() => {
                showToast("Inbox Refreshed!");
            });
        }

        async function checkInbox() {
            if (!currentEmail) return;

            try {
                const res = await fetch(`https://api.catchmail.io/api/v1/mailbox?address=${encodeURIComponent(currentEmail)}`);
                
                if (!res.ok) {
                    document.getElementById("status").innerText = "Error";
                    return;
                }

                const data = await res.json();
                const messages = data.messages || [];
                const inboxList = document.getElementById("inboxList");

                if (messages.length === 0) {
                    inboxList.innerHTML = `<div style="text-align: center; color: var(--subtext-color); padding-top: 60px;">No messages yet</div>`;
                    document.getElementById("status").innerText = "Live Checking...";
                    return;
                }

                inboxList.innerHTML = "";
                messages.forEach(msg => {
                    const item = document.createElement("div");
                    item.className = "msg-item";
                    item.innerHTML = `
                        <div class="msg-from">${msg.from}</div>
                        <div class="msg-subject">${msg.subject}</div>
                    `;
                    item.onclick = () => openMessage(msg.id);
                    inboxList.appendChild(item);
                });
                document.getElementById("status").innerText = "Updated";
            } catch (e) {
                document.getElementById("status").innerText = "Retrying...";
            }
        }

        async function openMessage(msgId) {
            try {
                const res = await fetch(`https://api.catchmail.io/api/v1/message/${msgId}?mailbox=${encodeURIComponent(currentEmail)}`);
                const msg = await res.json();

                document.getElementById("msgHeader").innerText = `From: ${msg.from}\nSubject: ${msg.subject}`;
                
                const htmlBody = msg.body?.html;
                const textBody = msg.body?.text;
                
                document.getElementById("msgBody").innerHTML = htmlBody || textBody || "No Content";
                document.getElementById("msgContent").style.display = "block";
            } catch (e) {
                showToast("Could not load message detail.");
            }
        }

        function copyEmail() {
            if (currentEmail) {
                navigator.clipboard.writeText(currentEmail);
                showToast("Copied: " + currentEmail);
            }
        }

        window.onload = function() {
            document.getElementById("themeToggleBtn").innerText = savedTheme === "light" ? "🌙" : "☀️";
            loadSavedEmail();
        };
    </script>
</body>
</html>
