    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        document.getElementById("themeToggleBtn").innerText = newTheme === "light" ? "🌙" : "☀️";
    }

    const savedTheme = localStorage.getItem("theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);

    function toggleDrawer() {
        document.getElementById('sideDrawer').classList.add('open');
        document.getElementById('drawerOverlay').classList.add('active');
    }

    function closeDrawer() {
        document.getElementById('sideDrawer').classList.remove('open');
        document.getElementById('drawerOverlay').classList.remove('active');
    }

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateCustomName() {
        const chkName = document.getElementById("chkName").checked;
        const chkFullName = document.getElementById("chkFullName").checked;
        const chkNickname = document.getElementById("chkNickname").checked;
        const chkGender = document.getElementById("chkGender").checked;

        if (!chkName && !chkFullName && !chkNickname && !chkGender) {
            alert("অনুগ্রহ করে অন্তত যেকোনো একটি অপশনে টিক দিন!");
            return;
        }

        const country = document.getElementById("countrySelect").value;
        const data = countryData[country] || countryData.US;

        let genderSelect = document.getElementById("genderSelect").value;
        let selectedGender = genderSelect;
        if (genderSelect === "random") {
            selectedGender = Math.random() > 0.5 ? "male" : "female";
        }

        let firstName = selectedGender === "male" ? getRandomItem(data.maleFirst) : getRandomItem(data.femaleFirst);
        let lastName = getRandomItem(data.last);
        let nickname = getRandomItem(data.nick);

        let outputParts = [];

        // 1. Name
        if (chkName) {
            outputParts.push(firstName);
        }

        // 2. Full Name
        if (chkFullName) {
            outputParts.push(`${firstName} ${lastName}`);
        }

        // 3. Nickname Format: (nick)
        if (chkNickname) {
            outputParts.push(`(${nickname})`);
        }

        // 4. Gender
        if (chkGender) {
            let genderText = selectedGender.charAt(0).toUpperCase() + selectedGender.slice(1);
            outputParts.push(`[${genderText}]`);
        }

        let finalName = outputParts.join(" ");

        document.getElementById("resultName").innerText = finalName;
        document.getElementById("resultBox").style.display = "block";
    }

    function copyName() {
        let text = document.getElementById("resultName").innerText;
        navigator.clipboard.writeText(text).then(() => {
            let notice = document.getElementById("copyNotice");
            notice.style.display = "block";
            setTimeout(() => { notice.style.display = "none"; }, 2000);
        });
    }

    window.onload = function() {
        document.getElementById("themeToggleBtn").innerText = savedTheme === "light" ? "🌙" : "☀️";
    };
    </script>
</body>
</html>
